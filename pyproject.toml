[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "lumastir"
version = "0.2.0"
description = "RPi Hardware controller for Lumastir configurations"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "fastapi>=0.115,<1",
    "pydantic>=2.8,<3",
    "uvicorn>=0.30,<1",
    "pyyaml>=6,<7",
]

[project.optional-dependencies]
hardware = [
    "rpi.gpio",
    "adafruit-circuitpython-pca9685",
]
dev = ["pytest>=8,<10", "httpx>=0.27,<1", "ruff>=0.11,<1"]

[tool.hatch.build.targets.wheel]
packages = ["src/lumastir"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py39"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[project.scripts]
lumastir-server = "lumastir.server:start"
lumastir-cli = "lumastir.cli:main"
lumastir-demo = "lumastir.demo:main"
